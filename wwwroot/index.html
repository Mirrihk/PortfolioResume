<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio-Seb</title>
    <base href="/" />

    <!-- App CSS -->
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/skills.css" />
    <link rel="stylesheet" href="css/forms.css" />
    <link rel="stylesheet" href="css/error.css" />
    <link rel="stylesheet" href="css/loader.css" />

    <!-- NProgress (top loading bar) -->
    <link rel="stylesheet" href="https://unpkg.com/nprogress@0.2.0/nprogress.css">
    <!-- Optional: provide your own favicon to avoid 404 -->
    <!-- <link rel="icon" href="/favicon.ico"> -->
</head>
<body style="margin:0; padding:0; background-color:#000;">

    <!-- Blazor mount point (KEEP THIS EMPTY, DO NOT REMOVE) -->
    <div id="app"></div>

    <!-- Loader overlay (remove THIS after Blazor starts) -->
    <div id="loader" class="skeleton-screen" role="status" aria-live="polite" aria-busy="true">
        <div class="skeleton-card">
            <div class="flex">
                <div class="shimmer circle" aria-hidden="true"></div>
                <div style="flex:1">
                    <div class="shimmer row wide" style="width: 60%;" aria-hidden="true"></div>
                    <div class="shimmer row" style="width: 40%;" aria-hidden="true"></div>
                </div>
            </div>
            <div class="shimmer row wide" style="width: 100%; margin-top: 20px;" aria-hidden="true"></div>
            <div class="shimmer row" style="width: 90%;" aria-hidden="true"></div>
            <div class="shimmer row" style="width: 80%;" aria-hidden="true"></div>
            <div class="muted">Loading Portfolio-Seb… preparing WebAssembly & Firebase.</div>
            <div class="tips">Tip: You can sign in with Google or GitHub once the app is ready.</div>
        </div>
    </div>

    <!-- Blazor error UI (shown if boot fails) -->
    <div id="blazor-error-ui" style="display:none">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Firebase SDKs (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- Blazor runtime (load once, do not autostart) -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>

    <!-- Firebase init -->
    <!-- Firebase init -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD5zDDoras1a77f1c3-GZDE4FaCk5uAl6s",
            authDomain: "sebastian-ccf8e.firebaseapp.com",
            projectId: "sebastian-ccf8e",
            appId: "sebastian-ccf8e"
        };

        const app = firebase.apps.length
            ? firebase.app()
            : firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();

        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseFirestore = firebase.firestore();

        const persistenceReady = auth
            .setPersistence(firebase.auth.Auth.Persistence.LOCAL)
            .catch(error => {
                console.error(
                    "Firebase persistence could not be enabled:",
                    error);
            });

        let initialAuthStateResolved = false;

        const authReady = new Promise(resolve => {
            auth.onAuthStateChanged(
                user => {
                    syncStoredAuthState(user);

                    if (!initialAuthStateResolved) {
                        initialAuthStateResolved = true;
                        resolve(user);
                    }
                },
                error => {
                    console.error(
                        "Firebase auth-state error:",
                        error);

                    if (!initialAuthStateResolved) {
                        initialAuthStateResolved = true;
                        resolve(null);
                    }
                });
        });

        function getUserDisplayName(user) {
            return user?.displayName ||
                user?.email ||
                user?.uid ||
                "Account";
        }

        function syncStoredAuthState(user) {
            if (user) {
                localStorage.setItem(
                    "isLoggedIn",
                    "true");

                localStorage.setItem(
                    "username",
                    getUserDisplayName(user));

                return;
            }

            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("username");
        }

        function createSuccessResult(user) {
            return {
                success: true,
                message: null,
                isSignedIn: true,
                displayName: getUserDisplayName(user),
                email: user?.email || null
            };
        }

        function createFailureResult(error) {
            console.error(
                "Firebase authentication failed:",
                error);

            return {
                success: false,
                message: getFriendlyAuthMessage(error),
                isSignedIn: false,
                displayName: null,
                email: null
            };
        }

        function getFriendlyAuthMessage(error) {
            switch (error?.code) {
                case "auth/invalid-email":
                    return "Enter a valid email address.";

                case "auth/invalid-credential":
                case "auth/user-not-found":
                case "auth/wrong-password":
                    return "The email or password is incorrect.";

                case "auth/email-already-in-use":
                    return "An account already exists for this email.";

                case "auth/weak-password":
                    return "Use a password with at least six characters.";

                case "auth/popup-blocked":
                    return "Your browser blocked the sign-in popup.";

                case "auth/popup-closed-by-user":
                    return "The sign-in popup was closed before completion.";

                case "auth/account-exists-with-different-credential":
                    return "This email already uses a different sign-in provider.";

                case "auth/operation-not-allowed":
                    return "This sign-in method is not enabled yet.";

                case "auth/too-many-requests":
                    return "Too many attempts. Please wait and try again.";

                default:
                    return error?.message ||
                        "Sign-in failed. Please try again.";
            }
        }

        window.authProvider = {
            async loginWithEmail(email, password) {
                try {
                    await persistenceReady;

                    const credential =
                        await auth.signInWithEmailAndPassword(
                            email,
                            password);

                    return createSuccessResult(
                        credential.user);
                }
                catch (error) {
                    return createFailureResult(error);
                }
            },

            async loginWithGoogle() {
                try {
                    await persistenceReady;

                    const provider =
                        new firebase.auth.GoogleAuthProvider();

                    const credential =
                        await auth.signInWithPopup(provider);

                    return createSuccessResult(
                        credential.user);
                }
                catch (error) {
                    return createFailureResult(error);
                }
            },

            async loginWithGitHub() {
                try {
                    await persistenceReady;

                    const provider =
                        new firebase.auth.GithubAuthProvider();

                    const credential =
                        await auth.signInWithPopup(provider);

                    return createSuccessResult(
                        credential.user);
                }
                catch (error) {
                    return createFailureResult(error);
                }
            },

            async createAccount(
                email,
                password,
                displayName) {

                try {
                    await persistenceReady;

                    const credential =
                        await auth.createUserWithEmailAndPassword(
                            email,
                            password);

                    if (displayName?.trim()) {
                        await credential.user.updateProfile({
                            displayName: displayName.trim()
                        });
                    }

                    return createSuccessResult(
                        credential.user);
                }
                catch (error) {
                    return createFailureResult(error);
                }
            },

            async getAuthState() {
                await authReady;

                const user = auth.currentUser;

                return {
                    isSignedIn: Boolean(user),
                    displayName:
                        user
                            ? getUserDisplayName(user)
                            : null,
                    email: user?.email || null
                };
            },

            async logout() {
                try {
                    await auth.signOut();
                    return true;
                }
                catch (error) {
                    console.error(
                        "Firebase sign-out failed:",
                        error);

                    return false;
                }
            }
        };
    </script>

    <!-- NProgress JS + single guarded boot -->
    <script src="https://unpkg.com/nprogress@0.2.0/nprogress.js"></script>
    <script>
        // Show the top bar immediately
        if (window.NProgress) { NProgress.start(); NProgress.set(0.35); }

        // Surface errors instead of silent black screen
        window.addEventListener('error', (e) => {
            console.error('Window error:', e.error || e.message);
            document.getElementById('blazor-error-ui').style.display = 'block';
        });
        window.addEventListener('unhandledrejection', (e) => {
            console.error('Unhandled promise rejection:', e.reason);
            document.getElementById('blazor-error-ui').style.display = 'block';
        });

        (function bootOnce() {
            if (window.__blazorBooted) return; // hard guard
            window.__blazorBooted = true;

            function depsReady() {
                return !!(window.firebaseApp && window.firebaseAuth && window.firebaseFirestore);
            }

            (function waitForFirebase() {
                if (!depsReady()) { setTimeout(waitForFirebase, 40); return; }

                (async () => {
                    try {
                        if (window.NProgress) NProgress.inc(0.15);
                        console.log('Starting Blazor…');
                        await Blazor.start();
                        console.log('Blazor started.');
                    } catch (err) {
                        console.error('Blazor.start() failed:', err);
                        document.getElementById('blazor-error-ui').style.display = 'block';
                    } finally {
                        const loader = document.getElementById("loader");
                        loader?.setAttribute("aria-busy", "false");
                        if (window.NProgress) NProgress.done();
                        // Remove ONLY the loader overlay (keep #app)
                        setTimeout(() => loader?.remove(), 150);
                    }
                })();
            })();
        })();
    </script>
</body>
</html>
