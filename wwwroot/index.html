<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sebastian Alvarez | Portfolio</title>
    <base href="/" />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/skills.css" />
    <link rel="stylesheet" href="css/forms.css" />
    <link rel="stylesheet" href="css/error.css" />
    <link rel="stylesheet" href="css/loader.css" />
    <link rel="stylesheet" href="https://unpkg.com/nprogress@0.2.0/nprogress.css">
</head>
<body style="margin:0; padding:0; background-color:#000;">
    <div id="app"></div>

    <div id="loader" class="skeleton-screen" role="status" aria-live="polite" aria-busy="true">
        <div class="skeleton-card">
            <div class="flex">
                <div class="shimmer circle" aria-hidden="true"></div>
                <div style="flex:1">
                    <div class="shimmer row wide" style="width: 60%;" aria-hidden="true"></div>
                    <div class="shimmer row" style="width: 40%;" aria-hidden="true"></div>
                </div>
            </div>
            <div class="shimmer row wide" style="width: 100%; margin-top: 20px;" aria-hidden="true"></div>
            <div class="shimmer row" style="width: 90%;" aria-hidden="true"></div>
            <div class="shimmer row" style="width: 80%;" aria-hidden="true"></div>
            <div class="muted">Loading Sebastian's portfolio…</div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD5zDDoras1a77f1c3-GZDE4FaCk5uAl6s",
            authDomain: "sebastian-ccf8e.firebaseapp.com",
            projectId: "sebastian-ccf8e",
            appId: "sebastian-ccf8e"
        };

        const app = firebase.initializeApp(firebaseConfig);
        window.firebaseApp = app;
        window.firebaseAuth = firebase.auth();
        window.firebaseFirestore = firebase.firestore();

        function friendlyAuthMessage(error) {
            const messages = {
                "auth/email-already-in-use": "An account already exists for this email.",
                "auth/invalid-email": "Enter a valid email address.",
                "auth/operation-not-allowed": "Email and password sign-up is not enabled yet.",
                "auth/weak-password": "Choose a stronger password with at least 6 characters."
            };

            return messages[error?.code] || "Firebase could not complete the request.";
        }

        window.authProvider = {
            async loginWithGoogle() {
                try {
                    await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
                    return true;
                } catch (error) {
                    console.error(error);
                    return false;
                }
            },

            async loginWithGitHub() {
                try {
                    await firebase.auth().signInWithPopup(new firebase.auth.GithubAuthProvider());
                    return true;
                } catch (error) {
                    console.error(error);
                    return false;
                }
            },

            async createAccount(email, password, displayName) {
                try {
                    const credential = await firebase.auth()
                        .createUserWithEmailAndPassword(email, password);

                    if (credential.user && displayName) {
                        await credential.user.updateProfile({ displayName });
                    }

                    return { success: true, message: null };
                } catch (error) {
                    console.error(error);
                    return { success: false, message: friendlyAuthMessage(error) };
                }
            },

            async logout() {
                try {
                    await firebase.auth().signOut();
                    return true;
                } catch (error) {
                    console.error(error);
                    return false;
                }
            },

            isSignedIn() {
                return firebase.auth().currentUser !== null;
            },

            getCurrentUserDisplayName() {
                const user = firebase.auth().currentUser;
                return user ? (user.displayName || user.email || "Account") : null;
            }
        };
    </script>

    <script src="https://unpkg.com/nprogress@0.2.0/nprogress.js"></script>
    <script>
        if (window.NProgress) {
            NProgress.start();
            NProgress.set(0.35);
        }

        window.addEventListener('error', (event) => {
            console.error('Window error:', event.error || event.message);
            document.getElementById('blazor-error-ui').style.display = 'block';
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
            document.getElementById('blazor-error-ui').style.display = 'block';
        });

        (function bootOnce() {
            if (window.__blazorBooted) return;
            window.__blazorBooted = true;

            function dependenciesReady() {
                return !!(window.firebaseApp && window.firebaseAuth && window.firebaseFirestore);
            }

            (function waitForFirebase() {
                if (!dependenciesReady()) {
                    setTimeout(waitForFirebase, 40);
                    return;
                }

                (async () => {
                    try {
                        if (window.NProgress) NProgress.inc(0.15);
                        await Blazor.start();
                    } catch (error) {
                        console.error('Blazor.start() failed:', error);
                        document.getElementById('blazor-error-ui').style.display = 'block';
                    } finally {
                        const loader = document.getElementById("loader");
                        loader?.setAttribute("aria-busy", "false");
                        if (window.NProgress) NProgress.done();
                        setTimeout(() => loader?.remove(), 150);
                    }
                })();
            })();
        })();
    </script>
</body>
</html>
